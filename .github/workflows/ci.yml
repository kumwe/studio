name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Studio
        uses: ./.github/actions/setup-studio

      - name: Run quality gate
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-check npm dependency SBOM generation (not release evidence)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('sbom.cdx.json','utf8'))"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Studio with Chromium
        uses: ./.github/actions/setup-studio
        with:
          install-playwright: 'true'

      - name: Run accessibility lane
        run: npm run check:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .cache/playwright/report
          retention-days: 7
