name: Canvas branch development

on:
  push:
    branches:
      - feature/canvas-authoring-completion
    paths:
      - .github/canvas-change.patch
      - .github/workflows/canvas-branch-development.yml

permissions:
  contents: read

concurrency:
  group: canvas-branch-development
  cancel-in-progress: false

jobs:
  apply-change:
    if: github.repository == 'kumwe/studio' && github.ref == 'refs/heads/feature/canvas-authoring-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact proposed branch change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the explicit patch without a force push
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patch=.github/canvas-change.patch
          test -f "$patch" || exit 0
          branch=feature/canvas-authoring-completion
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s)"
          git apply --check "$patch"
          git apply --index "$patch"
          git rm -- "$patch"
          git config user.name 'eWɘyn'
          git config user.email '5607939+Llewellynvdm@users.noreply.github.com'
          git commit -m "$subject"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

  browser-development-snapshot:
    if: github.repository == 'kumwe/studio' && github.ref == 'refs/heads/feature/canvas-authoring-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the shared Studio environment with Chromium
        uses: ./.github/actions/setup-studio
        with:
          install-playwright: 'true'

      - name: Package only public browser binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-canvas-browser"
          tar -czf "$RUNNER_TEMP/studio-canvas-browser/chromium.tar.gz" -C "$HOME/.cache" ms-playwright
          sha256sum "$RUNNER_TEMP/studio-canvas-browser/chromium.tar.gz" > "$RUNNER_TEMP/studio-canvas-browser/SHA256SUMS"

      - name: Upload temporary browser snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-canvas-browser
          path: ${{ runner.temp }}/studio-canvas-browser
          retention-days: 1
          compression-level: 0
