name: Canvas branch development

on:
  push:
    branches:
      - feature/canvas-authoring-completion
    paths:
      - .github/canvas-change.patch
      - .github/workflows/canvas-branch-development.yml

permissions:
  contents: read

concurrency:
  group: canvas-branch-development
  cancel-in-progress: false

jobs:
  apply-change:
    if: github.repository == 'kumwe/studio' && github.ref == 'refs/heads/feature/canvas-authoring-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact proposed branch change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the explicit patch without a force push
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patch=.github/canvas-change.patch
          test -f "$patch" || exit 0
          branch=feature/canvas-authoring-completion
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          subject="$(git log -1 --format=%s)"
          input="$patch"
          header="$(head -n 1 "$patch")"
          if [[ "$header" =~ ^\#\ canvas-patch-gzip-base64\ ([a-f0-9]{64})$ ]]; then
            digest="${BASH_REMATCH[1]}"
            input="$RUNNER_TEMP/canvas-change.decoded.patch"
            test "$(wc -c < "$patch")" -le 4194304
            tail -n +2 "$patch" | base64 --decode | gzip --decompress > "$input"
            test "$(wc -c < "$input")" -le 16777216
            test "$(sha256sum "$input" | cut -d ' ' -f 1)" = "$digest"
          fi
          git apply --recount --check "$input"
          git apply --recount --index "$input"
          git rm -- "$patch"
          git config user.name 'eWɘyn'
          git config user.email '5607939+Llewellynvdm@users.noreply.github.com'
          git commit -m "$subject"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
