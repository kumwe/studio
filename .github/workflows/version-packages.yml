name: Version packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  version:
    name: Maintain the Changesets release pull request and publish alphas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      # Fails fast with a clear identity when the npm token is missing,
      # invisible to this repository, or invalid — separating secret-delivery
      # problems from token-permission problems before any publish attempt.
      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN is empty in this job - the secret is not reaching the workflow.'
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # With pending changesets this maintains the version pull request; once
      # that pull request merges, it publishes the versioned packages instead.
      # Changesets pre mode keeps every publish on the alpha dist-tag; stable
      # releases stay behind the Gate B release-readiness guard.
      - name: Create or update version pull request, or publish
        id: release
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          pr-title: 'chore: version Studio packages'
          publish-script: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs on every push rather than only after a publish, so drift left by
      # an earlier run is repaired on the next run instead of outliving it.
      - name: Reconcile the alpha dist-tag
        run: node scripts/reconcile-alpha-tag.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
