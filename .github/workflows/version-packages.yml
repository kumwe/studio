name: Alpha release train

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact lowercase 40-character SHA currently at the head of main
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Maintain alpha, publish it, or pause outside the alpha train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A deleted or failed run can be recovered after rotating NPM_TOKEN, but
      # only for the exact commit that is still the public head of main.
      - name: Validate manual recovery target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_SHA" ]]

      - name: Set up Studio
        uses: ./.github/actions/setup-studio

      - name: Run quality gate
        run: npm run check

      # Pending changesets mean this run only maintains the version PR and has
      # no reason to read a registry credential. Once that PR is merged there
      # are no top-level changesets, and the same workflow enters publication.
      - name: Inspect alpha release plan
        id: plan
        run: node scripts/release-plan.mjs --github-output

      - name: Confirm this workflow owns only the alpha channel
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
          RELEASE_OPERATION: ${{ steps.plan.outputs.operation }}
          RELEASE_PRE_MODE: ${{ steps.plan.outputs.pre_mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_OPERATION" == "inactive" ]]; then
            echo "Alpha train is paused while RC is active, or idle until the next post-stable Changeset."
          else
            [[ "$RELEASE_CHANNEL" == "alpha" ]]
            [[ "$RELEASE_PRE_MODE" == "pre" || "$RELEASE_PRE_MODE" == "enter" ]]
          fi

      # Authenticate only on the actual publish path. This lets a missing or
      # rotated token fail publication clearly without blocking creation of the
      # recoverable alpha version PR.
      - name: Generate approved local package tarball digests
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:artifacts

      - name: Verify npm authentication
        if: steps.plan.outputs.operation == 'publish'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN is empty in this job - the secret is not reaching the workflow.'
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # With pending changesets this maintains the version pull request; once
      # that pull request merges, the guarded script publishes only a numeric
      # alpha coordinate. Beta, RC, and stable promotion cannot pass this path.
      - name: Create or update version pull request, or publish
        id: release
        if: steps.plan.outputs.operation != 'inactive'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: 'chore: version Studio packages'
          publish-script: npm run release:publish-alpha
          version-script: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ steps.plan.outputs.operation == 'publish' && 'true' || 'false' }}
          NODE_AUTH_TOKEN: ${{ steps.plan.outputs.operation == 'publish' && steps.plan.outputs.channel == 'alpha' && steps.plan.outputs.pre_mode == 'pre' && secrets.NPM_TOKEN || '' }}

      # Newly published packages must match the locally approved bytes and
      # provenance before this workflow is allowed to move a public tag.
      - name: Verify immutable package bits before moving the alpha tag
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_PROVENANCE_COMMIT: ${{ github.sha }}
          RELEASE_PROVENANCE_WORKFLOW: .github/workflows/version-packages.yml
          RELEASE_REQUIRE_PROVENANCE: 'true'

      - name: Reconcile the alpha dist-tag
        if: steps.plan.outputs.operation == 'publish'
        run: node scripts/reconcile-alpha-tag.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the complete published release set, provenance, and alpha tag
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_DIST_TAG: alpha
          RELEASE_PROVENANCE_COMMIT: ${{ github.sha }}
          RELEASE_PROVENANCE_WORKFLOW: .github/workflows/version-packages.yml
          RELEASE_REQUIRE_PROVENANCE: 'true'
