name: Beta development train

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact lowercase 40-character SHA currently at the head of main
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Maintain beta, publish it, or pause during governed promotion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A deleted or failed run can be recovered after rotating NPM_TOKEN, but
      # only for the exact commit that is still the public head of main.
      - name: Validate manual recovery target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_SHA" ]]

      - name: Set up Studio
        uses: ./.github/actions/setup-studio

      # Pending changesets mean this run only maintains the generated beta version PR and has
      # no reason to read a registry credential. Once that PR is merged there
      # are no top-level changesets, and the same workflow enters publication.
      - name: Inspect beta release plan
        id: plan
        run: node scripts/release-plan.mjs --github-output

      - name: Confirm this workflow owns only the beta channel
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
          RELEASE_OPERATION: ${{ steps.plan.outputs.operation }}
          RELEASE_PRE_MODE: ${{ steps.plan.outputs.pre_mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_OPERATION" == "inactive" ]]; then
            echo "Beta train is paused while a product-complete RC is active, or idle without release intent."
          else
            [[ "$RELEASE_CHANNEL" == "beta" ]]
            [[ "$RELEASE_PRE_MODE" == "pre" || "$RELEASE_PRE_MODE" == "enter" || "$RELEASE_PRE_MODE" == "reset" ]]
          fi

      - name: Run repository quality for non-publishing beta work
        if: steps.plan.outputs.operation != 'publish'
        run: npm run check

      - name: Set up pinned PHP for beta candidate qualification
        if: steps.plan.outputs.operation == 'publish'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install locked Chromium for beta candidate qualification
        if: steps.plan.outputs.operation == 'publish'
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Qualify the exact beta publication source
        if: steps.plan.outputs.operation == 'publish'
        run: npm run qualify:candidate

      # Authenticate only on the actual publish path. This lets a missing or
      # rotated token fail publication clearly without blocking creation of the
      # recoverable beta version PR.
      - name: Generate approved local package tarball digests
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:artifacts

      - name: Verify npm authentication
        if: steps.plan.outputs.operation == 'publish'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN is empty in this job - the secret is not reaching the workflow.'
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets owns version calculation and the generated version PR only.
      # Registry publication uses the retained, locally approved tarballs below
      # so Changesets cannot move beta/latest or create releases before proof.
      - name: Create or update the version pull request
        id: release
        if: steps.plan.outputs.operation == 'version'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          create-github-releases: false
          pr-title: 'chore: version Studio packages'
          push-git-tags: false
          version-script: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Changesets reads prerelease state before running version-script. During
      # the historical rc-to-beta reset it would otherwise append "(rc)" to a
      # PR whose generated contents are explicitly beta.
      - name: Keep the generated version pull request labeled beta
        if: steps.plan.outputs.operation == 'version' && steps.release.outputs['pr-number'] != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release.outputs['pr-number'] }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh pr edit "$PR_NUMBER" --title 'chore: version Studio packages (beta)'
          [[ "$(gh pr view "$PR_NUMBER" --json title --jq .title)" == 'chore: version Studio packages (beta)' ]]

      - name: Publish missing approved tarballs to a non-channel staging tag
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:publish-prerelease
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          STUDIO_EXPECTED_MAIN_SHA: ${{ github.sha }}

      # Newly published packages must match the locally approved bytes and
      # provenance before this workflow is allowed to move a public tag.
      # A later main commit re-verifies bits published from an earlier one;
      # immutable coordinates can never re-bind the newer dispatch commit, so
      # ancestry of the checked-out head is accepted alongside the exact SHA.
      - name: Verify immutable package bits before moving the beta tag
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_PROVENANCE_ANCESTOR_OK: 'true'
          RELEASE_PROVENANCE_COMMIT: ${{ github.sha }}
          RELEASE_PROVENANCE_WORKFLOW: .github/workflows/version-packages.yml
          RELEASE_REQUIRE_PROVENANCE: 'true'

      - name: Reconcile the beta dist-tag
        if: steps.plan.outputs.operation == 'publish'
        run: node scripts/reconcile-beta-tag.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STUDIO_EXPECTED_MAIN_SHA: ${{ github.sha }}

      - name: Verify the complete published release set, provenance, and beta tag
        id: verified_beta
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_DIST_TAG: beta
          RELEASE_PROVENANCE_ANCESTOR_OK: 'true'
          RELEASE_PROVENANCE_COMMIT: ${{ github.sha }}
          RELEASE_PROVENANCE_WORKFLOW: .github/workflows/version-packages.yml
          RELEASE_REQUIRE_PROVENANCE: 'true'
          RELEASE_WRITE_PROVENANCE_OUTPUT: 'true'

      - name: Generate immutable beta GitHub release notes
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:notes > release-notes.md
        env:
          PROMOTION_CHANNEL: beta
          PROMOTION_EXPECTED_VERSION: ${{ steps.verified_beta.outputs.version }}
          PROMOTION_PUBLISH_SOURCE_SHA: ${{ steps.verified_beta.outputs.provenance_commit }}

      # Reconcile one source-bound GitHub prerelease only after the registry
      # family, provenance, and beta dist-tag have all passed final proof.
      - name: Create or verify the coordinated beta GitHub prerelease
        if: steps.plan.outputs.operation == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RELEASE_CHANNEL: beta
          GITHUB_RELEASE_VERSION: ${{ steps.verified_beta.outputs.version }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PUBLISH_SOURCE_SHA: ${{ steps.verified_beta.outputs.provenance_commit }}
          VERSION: ${{ steps.verified_beta.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]
          [[ "$PUBLISH_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" =~ ^[a-f0-9]{40}$ ]]
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]
          git cat-file -e "${PUBLISH_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$PUBLISH_SOURCE_SHA" "$EXPECTED_MAIN_SHA"
          tag="studio-v${VERSION}"
          mapfile -t release_assets < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const approved = JSON.parse(readFileSync(".release-artifacts/approved-package-integrities.json", "utf8"));
            console.log(approved.browser.path);
            console.log(approved.browser.checksumPath);
          ')
          [[ "${#release_assets[@]}" -eq 2 ]]
          archive="${release_assets[0]}"
          checksum="${release_assets[1]}"
          [[ -f "$archive" && -f "$checksum" ]]
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$checksum")")

          tag_ref="refs/tags/$tag"
          tag_status=0
          git ls-remote --exit-code origin "$tag_ref" >/dev/null 2>&1 || tag_status=$?
          if [[ "$tag_status" == "2" ]]; then
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="$tag_ref" -f sha="$PUBLISH_SOURCE_SHA" >/dev/null; then
              # A concurrent creator is acceptable only when it produced the exact governed tag.
              tag_status=0
              git ls-remote --exit-code origin "$tag_ref" >/dev/null 2>&1 || tag_status=$?
              [[ "$tag_status" == "0" ]]
            fi
          else
            [[ "$tag_status" == "0" ]]
          fi
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          [[ "$(git rev-list -n 1 "$tag")" == "$PUBLISH_SOURCE_SHA" ]]

          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_args=("$tag" --title "Studio ${VERSION}" --notes-file release-notes.md --prerelease --verify-tag)
            gh release create "${release_args[@]}" "$archive" "$checksum"
          else
            gh release view "$tag" --json body,isDraft,isPrerelease,name,tagName \
              > .release-artifacts/github-release.json
            GITHUB_RELEASE_REQUIRE_ASSETS=false node scripts/verify-github-release.mjs
            recovery_dir="$RUNNER_TEMP/studio-beta-release-recovery"
            mkdir -p "$recovery_dir"
            for asset in "$archive" "$checksum"; do
              asset_name="$(basename "$asset")"
              count="$(gh release view "$tag" --json assets --jq \
                "[.assets[] | select(.name == \"$asset_name\")] | length")"
              if [[ "$count" == "0" ]]; then
                gh release upload "$tag" "$asset"
              elif [[ "$count" == "1" ]]; then
                gh release download "$tag" --pattern "$asset_name" --dir "$recovery_dir"
                cmp --silent "$asset" "$recovery_dir/$asset_name"
              else
                echo "::error::GitHub release contains duplicate asset name $asset_name"
                exit 1
              fi
            done
          fi

          gh release view "$tag" --json assets,body,isDraft,isPrerelease,name,tagName \
            > .release-artifacts/github-release.json
          node scripts/verify-github-release.mjs
          verification_dir="$RUNNER_TEMP/studio-beta-release-verification"
          mkdir -p "$verification_dir"
          for asset in "$archive" "$checksum"; do
            asset_name="$(basename "$asset")"
            gh release download "$tag" --pattern "$asset_name" --dir "$verification_dir"
            cmp --silent "$asset" "$verification_dir/$asset_name"
          done
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git rev-list -n 1 "$tag")" == "$PUBLISH_SOURCE_SHA" ]]

      - name: Clean or report retained non-channel staging tags after complete success
        if: steps.plan.outputs.operation == 'publish'
        run: npm run release:cleanup-staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
