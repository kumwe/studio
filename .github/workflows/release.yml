name: Governed RC and stable promotion

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact lowercase 40-character SHA currently at the head of main
        required: true
        type: string
      channel:
        description: Promotion channel to prepare or publish
        required: true
        type: choice
        options:
          - rc
          - stable
      profiles:
        description: Optional exact fixed Version 2 profile set (RC preparation defaults to the complete set)
        required: false
        default: ''
        type: string
      candidate_sha:
        description: Qualified immutable RC SHA (publication and stable preparation only)
        required: false
        default: ''
        type: string
      gate_record_sha:
        description: Later main commit containing the accepted gate record and reproduced bundles
        required: false
        default: ''
        type: string

concurrency:
  group: governed-studio-promotion
  cancel-in-progress: false

jobs:
  plan:
    name: Validate exact main and classify the promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      gate: ${{ steps.plan.outputs.gate }}
      operation: ${{ steps.plan.outputs.operation }}
      profiles: ${{ steps.plan.outputs.profiles }}
      source_version: ${{ steps.plan.outputs.source_version }}
      target_version: ${{ steps.plan.outputs.target_version }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}

      - name: Validate immutable dispatch target
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]

      - name: Set up Studio
        uses: ./.github/actions/setup-studio

      - name: Run repository quality gate
        run: npm run check

      - name: Classify preparation, correction, or publication
        id: plan
        run: npm run release:promotion-plan
        env:
          PROMOTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          PROMOTION_GATE_RECORD_SHA: ${{ inputs.gate_record_sha }}
          PROMOTION_PROFILES: ${{ inputs.profiles }}

  prepare:
    name: Prepare the reviewed whole-family promotion PR
    needs: plan
    if: needs.plan.outputs.operation == 'prepare' || needs.plan.outputs.operation == 'correct'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: studio-${{ inputs.channel }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}

      - name: Check out qualified RC for stable preparation
        if: inputs.channel == 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .qualified-candidate
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Check out accepted evidence for stable preparation
        if: inputs.channel == 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .release-evidence
          persist-credentials: false
          ref: ${{ inputs.gate_record_sha }}

      - name: Revalidate current main before generating a pull request
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

      - name: Set up pinned PHP for generated-candidate qualification
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Studio with locked Chromium
        uses: ./.github/actions/setup-studio
        with:
          install-playwright: 'true'

      - name: Verify Gate B before preparing stable metadata
        if: inputs.channel == 'stable'
        run: npm run release:readiness
        env:
          STUDIO_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_GATE_EVIDENCE_ROOT: .release-evidence
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_PROMOTION_PHASE: prepare
          STUDIO_PUBLISH_SOURCE_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_QUALIFIED_CANDIDATE_ROOT: .qualified-candidate
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STUDIO_RELEASE_CHANNEL: stable
          STUDIO_REVIEWER_AUTHORITY_SHA256: ${{ vars.STUDIO_REVIEWER_AUTHORITY_SHA256 }}

      - name: Generate coordinated promotion metadata
        run: npm run release:prepare
        env:
          PROMOTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          PROMOTION_GATE_RECORD_SHA: ${{ inputs.gate_record_sha }}
          PROMOTION_PROFILES: ${{ inputs.profiles }}

      - name: Qualify generated promotion tree after metadata mutation
        run: npm run qualify:candidate

      - name: Create or recover the promotion pull request
        shell: bash
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ needs.plan.outputs.target_version }}
        run: |
          set -euo pipefail
          branch="release/promote-${CHANNEL}-${TARGET_VERSION//./-}"
          title="chore: promote Studio to ${TARGET_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- \
            .changeset \
            examples/reference-host/package.json \
            package-lock.json \
            packages/core/CHANGELOG.md packages/core/package.json \
            packages/media/CHANGELOG.md packages/media/package.json \
            packages/preview/CHANGELOG.md packages/preview/package.json \
            packages/protocol/CHANGELOG.md packages/protocol/package.json packages/protocol/studio-release.json \
            packages/renderer-web/CHANGELOG.md packages/renderer-web/package.json \
            packages/rich-text/CHANGELOG.md packages/rich-text/package.json \
            packages/studio-lit/CHANGELOG.md packages/studio-lit/package.json \
            packages/testkit/CHANGELOG.md packages/testkit/package.json packages/testkit/studio-release.json \
            release-profile-claims.json studio-release.json
          git diff --cached --check
          git commit -m "$title"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            [[ "$(git rev-parse HEAD^{tree})" == "$(git rev-parse refs/remotes/origin/$branch^{tree})" ]] || {
              echo "::error::Existing promotion branch has a different generated tree; inspect it before retrying."
              exit 1
            }
          else
            gh auth setup-git
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [[ -n "$pr_url" ]]; then
            echo "$pr_url"
          else
            gh pr create --base main --head "$branch" --title "$title" --body \
              "Generated whole-family ${CHANNEL} promotion. Merge only after required review and CI pass."
          fi

  stage:
    name: Quarantine the immutable RC for Gate A evidence
    needs: plan
    if: needs.plan.outputs.operation == 'stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: studio-rc
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact RC candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}

      - name: Revalidate exact main after protected approval
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]

      - name: Set up pinned PHP for RC candidate qualification
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up Studio with locked Chromium
        uses: ./.github/actions/setup-studio
        with:
          install-playwright: 'true'

      - name: Qualify the exact RC quarantine source after approval
        run: npm run qualify:candidate

      - name: Generate approved local package tarball digests
        run: npm run release:artifacts

      - name: Verify npm authentication
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish or recover the RC quarantine family
        run: npm run release:publish-stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          PROMOTION_CHANNEL: rc
          PROMOTION_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          PROMOTION_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}

      - name: Prove exact provenance and clean public-registry installation
        run: npm run release:verify-stage
        env:
          RELEASE_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}

  publish:
    name: Publish the immutable qualified package family
    needs: plan
    if: needs.plan.outputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: studio-${{ inputs.channel }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}

      - name: Check out exact current-main release controller for RC publication
        if: inputs.channel == 'rc'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .release-controller
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}

      - name: Check out qualified RC for stable publication
        if: inputs.channel == 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .qualified-candidate
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Check out accepted evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .release-evidence
          persist-credentials: false
          ref: ${{ inputs.gate_record_sha }}

      - name: Revalidate current main after protected approval
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

      - name: Set up pinned PHP for publication-source qualification
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Set up stable publication source with locked Chromium
        if: inputs.channel == 'stable'
        uses: ./.github/actions/setup-studio
        with:
          install-playwright: 'true'

      - name: Set up RC publication source with locked Chromium from the current controller
        if: inputs.channel == 'rc'
        uses: ./.release-controller/.github/actions/setup-studio
        with:
          working-directory: '.'
          install-playwright: 'true'

      - name: Set up current-main release controller
        if: inputs.channel == 'rc'
        uses: ./.release-controller/.github/actions/setup-studio
        with:
          working-directory: .release-controller

      - name: Revalidate immutable evidence and package state for stable
        if: inputs.channel == 'stable'
        run: npm run release:readiness
        env:
          STUDIO_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_GATE_EVIDENCE_ROOT: .release-evidence
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_PROMOTION_PHASE: publish
          STUDIO_PUBLISH_SOURCE_SHA: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}
          STUDIO_QUALIFIED_CANDIDATE_ROOT: ${{ inputs.channel == 'stable' && '.qualified-candidate' || '.' }}
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STUDIO_RELEASE_CHANNEL: ${{ inputs.channel }}
          STUDIO_REVIEWER_AUTHORITY_SHA256: ${{ vars.STUDIO_REVIEWER_AUTHORITY_SHA256 }}

      - name: Revalidate RC with the exact current-main controller
        if: inputs.channel == 'rc'
        working-directory: .release-controller
        run: node scripts/verify-release-gate.mjs
        env:
          STUDIO_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_GATE_EVIDENCE_ROOT: ../.release-evidence
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_PROMOTION_PHASE: publish
          STUDIO_PUBLISH_ROOT: ..
          STUDIO_PUBLISH_SOURCE_SHA: ${{ inputs.candidate_sha }}
          STUDIO_QUALIFIED_CANDIDATE_ROOT: ..
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STUDIO_RELEASE_CHANNEL: rc
          STUDIO_REVIEWER_AUTHORITY_SHA256: ${{ vars.STUDIO_REVIEWER_AUTHORITY_SHA256 }}

      - name: Qualify the exact immutable RC publication source
        if: inputs.channel == 'rc'
        run: npm run qualify:candidate

      - name: Generate approved local package tarball digests
        run: npm run release:artifacts

      # Registry credentials are intentionally unavailable to plan and prepare.
      - name: Verify npm authentication
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish missing approved tarballs to a non-channel staging tag
        run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          PROMOTION_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}
          STUDIO_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_GATE_EVIDENCE_ROOT: .release-evidence
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_PROMOTION_PHASE: publish
          STUDIO_PUBLISH_SOURCE_SHA: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}
          STUDIO_QUALIFIED_CANDIDATE_ROOT: ${{ inputs.channel == 'stable' && '.qualified-candidate' || '.' }}
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STUDIO_RELEASE_CHANNEL: ${{ inputs.channel }}
          STUDIO_REVIEWER_AUTHORITY_SHA256: ${{ vars.STUDIO_REVIEWER_AUTHORITY_SHA256 }}

      # Do not move a public channel tag until every newly published package
      # has been compared with the approved local tarball and provenance.
      - name: Verify immutable package bits before moving the channel tag
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}
          RELEASE_PROVENANCE_COMMIT: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}
          RELEASE_REQUIRE_PROVENANCE: 'true'

      - name: Reconcile the channel distribution tag
        run: npm run release:reconcile-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          STUDIO_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STUDIO_EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.target_version }}

      - name: Verify the complete registry release, provenance, and channel tag
        run: npm run release:verify-published
        env:
          RELEASE_APPROVED_ARTIFACTS: 'true'
          RELEASE_DIST_TAG: ${{ inputs.channel == 'stable' && 'latest' || 'rc' }}
          RELEASE_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}
          RELEASE_PROVENANCE_COMMIT: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}
          RELEASE_REQUIRE_PROVENANCE: 'true'

      - name: Generate immutable GitHub release notes
        run: npm run release:notes > release-notes.md
        env:
          PROMOTION_CHANNEL: ${{ inputs.channel }}
          PROMOTION_GATE_RECORD_SHA: ${{ inputs.gate_record_sha }}
          PROMOTION_EXPECTED_VERSION: ${{ needs.plan.outputs.target_version }}
          PROMOTION_PUBLISH_SOURCE_SHA: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}

      - name: Create or verify the GitHub release
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RELEASE_CHANNEL: ${{ inputs.channel }}
          GITHUB_RELEASE_VERSION: ${{ needs.plan.outputs.target_version }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          PUBLISH_SOURCE_SHA: ${{ inputs.channel == 'rc' && inputs.candidate_sha || inputs.expected_main_sha }}
          VERSION: ${{ needs.plan.outputs.target_version }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$remote_main" =~ ^[a-f0-9]{40}$ ]]
          [[ "$remote_main" == "$EXPECTED_MAIN_SHA" ]]
          tag="studio-v${VERSION}"
          mapfile -t release_assets < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const approved = JSON.parse(readFileSync(".release-artifacts/approved-package-integrities.json", "utf8"));
            console.log(approved.browser.path);
            console.log(approved.browser.checksumPath);
          ')
          [[ "${#release_assets[@]}" -eq 2 ]]
          archive="${release_assets[0]}"
          checksum="${release_assets[1]}"
          [[ -f "$archive" && -f "$checksum" ]]
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$checksum")")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_args=("$tag" --title "Studio ${VERSION}" --notes-file release-notes.md)
            if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              [[ "$(git rev-list -n 1 "$tag")" == "$PUBLISH_SOURCE_SHA" ]]
              release_args+=(--verify-tag)
            else
              release_args+=(--target "$PUBLISH_SOURCE_SHA")
            fi
            if [[ "$CHANNEL" == "rc" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}" "$archive" "$checksum"
          else
            gh release view "$tag" --json body,isDraft,isPrerelease,name,tagName \
              > .release-artifacts/github-release.json
            GITHUB_RELEASE_REQUIRE_ASSETS=false node scripts/verify-github-release.mjs
            recovery_dir="$RUNNER_TEMP/studio-release-recovery"
            mkdir -p "$recovery_dir"
            for asset in "$archive" "$checksum"; do
              asset_name="$(basename "$asset")"
              count="$(gh release view "$tag" --json assets --jq \
                "[.assets[] | select(.name == \"$asset_name\")] | length")"
              if [[ "$count" == "0" ]]; then
                gh release upload "$tag" "$asset"
              elif [[ "$count" == "1" ]]; then
                gh release download "$tag" --pattern "$asset_name" --dir "$recovery_dir"
                cmp --silent "$asset" "$recovery_dir/$asset_name"
              else
                echo "::error::GitHub release contains duplicate asset name $asset_name"
                exit 1
              fi
            done
          fi
          gh release view "$tag" --json assets,body,isDraft,isPrerelease,name,tagName \
            > .release-artifacts/github-release.json
          node scripts/verify-github-release.mjs
          verification_dir="$RUNNER_TEMP/studio-release-verification"
          mkdir -p "$verification_dir"
          for asset in "$archive" "$checksum"; do
            asset_name="$(basename "$asset")"
            gh release download "$tag" --pattern "$asset_name" --dir "$verification_dir"
            cmp --silent "$asset" "$verification_dir/$asset_name"
          done
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git rev-list -n 1 "$tag")" == "$PUBLISH_SOURCE_SHA" ]]

      - name: Remove the non-channel staging tag after complete success
        run: npm run release:cleanup-staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
