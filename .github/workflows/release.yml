name: Release readiness (publication disabled)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA of the accepted candidate
        required: true
        type: string
      gate_record_sha:
        description: Exact later commit containing the proposed Gate B record and bundles
        required: true
        type: string

concurrency:
  group: release-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Exercise the draft Gate B readiness guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable commit inputs
        shell: bash
        env:
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$STUDIO_RELEASE_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STUDIO_GATE_RECORD_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STUDIO_GATE_RECORD_COMMIT" != "$STUDIO_RELEASE_CANDIDATE_SHA" ]]

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Check out immutable later draft Gate B evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-evidence
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.gate_record_sha }}
          sparse-checkout: evidence

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Pin npm declared by the repository
        run: npm install --global npm@11.9.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the draft gate record and repository checks
        run: npm run release:readiness
        env:
          STUDIO_GATE_B_RECORD: .release-evidence/evidence/gates/gate-b.json
          STUDIO_GATE_EVIDENCE_ROOT: .release-evidence
          STUDIO_GATE_RECORD_COMMIT: ${{ inputs.gate_record_sha }}
          STUDIO_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}

      - name: Confirm publication remains disabled
        run: |
          echo "Registry publication is disabled until Gate B is accepted and ST-11 explicitly enables trusted publication."
          test -z "$(node -p 'require("./package.json").scripts.release ?? ""')"
