name: Set up Studio
description: Install the one supported Node, npm, dependency, and optional browser environment.

inputs:
  install-playwright:
    description: Install locked Chromium and its Linux system dependencies.
    required: false
    default: 'false'
  working-directory:
    description: Repository checkout whose lockfile and dependencies must be installed.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Pin npm declared by the repository
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm install --global npm@11.9.0

    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Install locked Playwright Chromium
      if: ${{ inputs.install-playwright == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ./node_modules/.bin/playwright install --with-deps chromium

    - name: Export current canvas development source
      if: ${{ github.job == 'quality' && github.head_ref == 'feature/canvas-authoring-completion' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        snapshot="$RUNNER_TEMP/studio-canvas-continuation"
        mkdir -p "$snapshot"
        git bundle create "$snapshot/source.bundle" HEAD
        git rev-parse HEAD > "$snapshot/source-sha.txt"
        (cd "$snapshot" && sha256sum source.bundle source-sha.txt > SHA256SUMS)

    - name: Retain source-only continuation snapshot
      if: ${{ github.job == 'quality' && github.head_ref == 'feature/canvas-authoring-completion' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: studio-canvas-continuation
        path: ${{ runner.temp }}/studio-canvas-continuation
        retention-days: 1
        compression-level: 0
